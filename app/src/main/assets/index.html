<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Склад шин</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: a phone-app column (max 480px, centered on wide screens): blue app bar, scrolling content, pink round add button.
   Color: Material blue bar, light grey-lavender page, white cards, green/red stock chips, pink FAB. Type: Roboto, like an Android app. */
:root{
  --bar:#2D9CD8; --bar-ink:#FFFFFF;
  --page:#DDE1E8; --bg:#F4F5F9; --card:#FFFFFF; --ink:#2B2F36; --muted:#7D8591; --line:#E3E6EB;
  --accent:#1B7DB7; --on-accent:#FFFFFF; --accent-soft:#E1F0F9;
  --good:#2E8B3A; --bad:#D8312B; --fab:#E91E63; --scrim:rgba(0,0,0,.45);
  --font:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bar:#1D78AA; --page:#07090B; --bg:#121519; --card:#1D2126; --ink:#E7E9EC; --muted:#9BA2AC; --line:#2B3036;
    --accent:#5BB6E8; --on-accent:#08202F; --accent-soft:#17384B; --good:#5BC26A; --bad:#FF7B73; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bar:#1D78AA; --page:#07090B; --bg:#121519; --card:#1D2126; --ink:#E7E9EC; --muted:#9BA2AC; --line:#2B3036;
  --accent:#5BB6E8; --on-accent:#08202F; --accent-soft:#17384B; --good:#5BC26A; --bad:#FF7B73; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.35 var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,p{margin:0}
button{font:inherit;color:inherit}
.app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:520px){.app{box-shadow:0 10px 44px rgba(0,0,0,.22)}}
#screen{display:flex;flex-direction:column;flex:1;min-height:0}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}
.neg{color:var(--bad)}
.muted{color:var(--muted)}

.bar{flex:none;display:flex;align-items:center;gap:2px;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 4px 0 4px;background:var(--bar);color:var(--bar-ink);box-shadow:0 2px 5px rgba(0,0,0,.22);z-index:3}
.bt{flex:1;min-width:0;margin:0 0 0 8px;font:500 20px/1.2 var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{position:relative;flex:none;width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:inherit;cursor:pointer}
.ib:active{background:rgba(255,255,255,.18)}
.ib .dot{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--fab);border:2px solid var(--bar)}
.sin{flex:1;min-width:0;height:44px;border:0;background:transparent;color:var(--bar-ink);font:400 18px var(--font);outline:none;padding:0 4px}
.sin::placeholder{color:rgba(255,255,255,.75)}
.ib:focus-visible,.row:focus-visible,.chip:focus-visible,.btn:focus-visible,.wbd:focus-visible,.fab:focus-visible,.nv:focus-visible,.pop button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.bar .ib:focus-visible{outline-color:#fff}
.sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

.strip{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 2px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 6px 0 12px;border:0;border-radius:17px;background:var(--accent-soft);color:var(--accent);font:500 14px var(--font);cursor:pointer}
.tag .ic{width:16px;height:16px}

#plist{padding-bottom:96px}
.row{position:relative;display:flex;gap:16px;padding:12px 16px;cursor:pointer;outline-offset:-2px}
.row::after{content:"";position:absolute;left:76px;right:0;bottom:0;border-bottom:1px solid var(--line)}
.row:active{background:rgba(127,127,127,.12)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font:500 15px var(--font)}
.rb{flex:1;min-width:0}
.rt{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.rc{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:14px}
.cn{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.ci{width:20px;height:20px;display:grid;place-items:center;border:1.5px solid currentColor;border-radius:5px}
.ci .ic{width:13px;height:13px;stroke-width:2}
.cn.g .ci{color:var(--good)} .cn.r .ci{color:var(--bad)} .cn.z .ci,.cn.b .ci{color:var(--muted)}
.cn.r b{color:var(--bad)}
.wbd{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 9px 0 7px;border:0;border-radius:13px;background:var(--accent-soft);color:var(--accent);font:500 12.5px var(--font);cursor:pointer;white-space:nowrap}
.wbd .ic{width:14px;height:14px;stroke-width:2}
.wbd.off{background:transparent;color:var(--muted);padding:0;cursor:default;font-weight:400}
.wbd.on{background:var(--accent);color:var(--on-accent)}
.wl{margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);font-size:13px;display:flex;flex-direction:column;gap:3px}
.wl div{display:flex;justify-content:space-between;gap:12px}
.wl span{color:var(--muted)}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}

.fab{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--fab);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.35);cursor:pointer;z-index:2}
.fab .ic{width:26px;height:26px;stroke-width:2.2}

.pg{padding:12px;display:flex;flex-direction:column;gap:12px}
.cd{background:var(--card);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.14);padding:16px}
.ti{font:500 18px/1.3 var(--font);letter-spacing:.01em;overflow-wrap:anywhere}
.sub{margin-top:6px;font-size:13px;color:var(--muted)}
.sh{display:flex;align-items:center;gap:14px;font-size:16px;margin-bottom:12px}
.si{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.si .ic{width:19px;height:19px}
.tg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center}
.th{padding-bottom:8px;font-size:13.5px;color:var(--muted)}
.tb{border-top:1px solid var(--line);padding:8px 0 6px}
.tb .lb{font-size:13.5px;margin-bottom:4px;overflow-wrap:anywhere}
.tb.tot .lb,.tb.tot .tg{font-weight:700}
.tb .tg{font-size:15px}
.fl{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:6px}
.sh+.fl{margin-top:0}
.fl small{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.fl div{font-size:16px}
.bgl{margin-top:10px}

.fi{display:flex;flex-direction:column;gap:2px;padding:6px 0}
.fi label{font-size:13px;color:var(--muted)}
.fi input,.fi select{width:100%;min-height:44px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font:400 16px var(--font);padding:6px 0;outline:none}
.fi select{appearance:none;-webkit-appearance:none}
.fi input:focus,.fi select:focus{border-bottom:2px solid var(--accent);padding-bottom:5px}
.fi2{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:14px}
.fi3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wn{font-weight:500;padding-top:10px}
.btn{min-height:48px;padding:0 20px;border:0;border-radius:6px;background:var(--accent);color:var(--on-accent);font:500 15px var(--font);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.btn.t{background:transparent;color:var(--accent)}
.btn.d{background:transparent;color:var(--bad)}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:400 12px/1.4 ui-monospace,monospace;padding:8px}

.drw{position:absolute;inset:0;z-index:30;visibility:hidden;transition:visibility 0s .22s}
.drw.open{visibility:visible;transition-delay:0s}
.drw .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s}
.drw.open .scrim{opacity:1}
.drw .pn{position:absolute;left:0;top:0;bottom:0;width:min(300px,84%);background:var(--card);transform:translateX(-100%);transition:transform .22s;display:flex;flex-direction:column;overflow-y:auto}
.drw.open .pn{transform:none}
.dh{background:var(--bar);color:var(--bar-ink);padding:calc(20px + env(safe-area-inset-top,0px)) 16px 18px;display:flex;flex-direction:column;gap:12px}
.dav{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font:500 22px var(--font)}
.dh b{display:block;font:500 18px var(--font)} .dh small{opacity:.88;font-size:13.5px}
.nv{display:flex;align-items:center;gap:22px;width:100%;min-height:52px;padding:0 20px;border:0;background:none;text-align:left;font:500 15.5px var(--font);color:var(--ink);cursor:pointer}
.nv .ic{color:var(--muted)}
.nv[aria-current="page"]{background:var(--accent-soft);color:var(--accent)} .nv[aria-current="page"] .ic{color:var(--accent)}

#ovl .scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .15s}
#ovl .scrim.clear{background:transparent}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:82%;overflow-y:auto;background:var(--card);border-radius:16px 16px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet h2{font:500 18px var(--font);margin-bottom:14px}
.sheet h3{margin:16px 0 8px;font:500 13px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);font:400 15px var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.pop{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:21;min-width:210px;background:var(--card);border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.3);padding:6px 0;animation:fade .12s}
.pop button{display:block;width:100%;min-height:48px;padding:0 18px;border:0;background:none;text-align:left;font:400 16px var(--font);color:var(--ink);cursor:pointer}
.pop button.d{color:var(--bad)}
.dlg{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:21;max-height:86%;overflow-y:auto;background:var(--card);border-radius:10px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.35);animation:fade .15s}
.dlg h2{font:500 18px var(--font);margin-bottom:10px}
#toast{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);z-index:40;max-width:calc(100% - 32px);padding:11px 18px;border-radius:8px;background:#32373E;color:#fff;font-size:14.5px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drw .pn,.drw .scrim,#toast{transition:none}#ovl *{animation:none!important}}

/* ---------- documents, cash, reconciliation ---------- */
.nvs{height:1px;background:var(--line);margin:6px 0}
.dh .rt2{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:4px 10px;border:0;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;font:500 13px var(--font);cursor:pointer;align-self:flex-start}
.sumb{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 4px}
.sumb .tile{flex:1;min-width:120px;background:var(--card);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:10px 12px}
.tile small{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font:500 17px var(--font);margin-top:2px;white-space:nowrap}
.tile.pos b{color:var(--good)} .tile.neg2 b{color:var(--bad)}
.dr{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 16px;cursor:pointer}
.dr::after{content:"";position:absolute;left:16px;right:0;bottom:0;border-bottom:1px solid var(--line)}
.dr:active{background:rgba(127,127,127,.12)}
.dr .l1{font-size:13px;color:var(--muted)}
.dr .l2{font:500 15.5px var(--font);overflow-wrap:anywhere}
.dr .l3{grid-column:1/-1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.dr .l3 i{font-style:normal;color:var(--ink)}
.dr .am{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font:500 16px var(--font);white-space:nowrap}
.dr .am small{display:block;font:400 12px var(--font);color:var(--muted)}
.am.in{color:var(--good)} .am.out{color:var(--bad)}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font:500 11.5px var(--font);vertical-align:1px}
.pill.out{background:rgba(216,49,43,.12);color:var(--bad)} .pill.in{background:rgba(46,139,58,.13);color:var(--good)}
.seg{display:flex;border:1px solid var(--accent);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:42px;border:0;background:transparent;color:var(--accent);font:500 14.5px var(--font);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ln{border:1px solid var(--line);border-radius:8px;padding:4px 12px 8px;margin-top:10px;position:relative}
.ln .x{position:absolute;right:2px;top:2px;width:40px;height:40px;color:var(--muted)}
.ln .fi:first-of-type{padding-right:36px}
.lnf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:10px}
.lsum{font-size:13px;color:var(--muted);padding-top:4px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font:500 17px var(--font);padding:12px 0 4px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.it small{color:var(--muted);font-size:13px}
.it b{font-weight:500;text-align:right;white-space:nowrap}
.at{width:100%;border-collapse:collapse;font-size:13px}
.at th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.at th:first-child,.at td:first-child{text-align:left}
.at td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.at td small{display:block;color:var(--muted);font-size:12px}
.at tr.sum td{font-weight:700;border-bottom:0}
.dl{font-size:15px;font-weight:500;margin-top:10px}
.dl.pos{color:var(--good)} .dl.neg{color:var(--bad)}
.per{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fi textarea{min-height:60px;font:400 15px var(--font);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0}
.bar .ib.tx{width:auto;padding:0 10px;border-radius:18px;font:500 14px var(--font)}
@media print{
  body{background:#fff}.app{max-width:none;height:auto;box-shadow:none;overflow:visible;background:#fff}
  .bar,.fab,#drawer,#ovl,#toast,.noprint{display:none!important}
  .sc{overflow:visible}.cd{box-shadow:none;border:1px solid #ccc}
}
</style>

<div class="app" id="app">
  <div id="screen"></div>
  <div class="drw" id="drawer" aria-hidden="true"></div>
  <div id="ovl"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};

var KEY='sklad-shin-v1';
var nf=function(n){return Math.round(n).toLocaleString('ru-RU')};
var f2=function(n){return (+n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})};
var money=function(n,cur){return f2(n)+' '+(cur==='USD'?'доллар':'сом')};
var num=function(v){var x=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isNaN(x)?0:x};
var norm=function(s){return String(s).toLowerCase().replace(/[^a-zа-я0-9]/g,'')};
var pad5=function(n){var s=String(n);while(s.length<5)s='0'+s;return s};
function plural(n,a,b,c){var m=Math.abs(n)%100,k=m%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>=2&&k<=4)return b;return c}

/* ---------- icons ---------- */
var I={
  menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',

  scan:'<path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M3 12h18"/>',
  back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  dots:'<g fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></g>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  box:'<path d="M3 8l9-4 9 4-9 4z"/><path d="M3 8v8l9 4 9-4V8M12 12v8"/>',
  house:'<path d="M3 10.5L12 4l9 6.5V20H3z"/><path d="M9 20v-6h6v6"/>',
  inbox:'<path d="M4 13l2.5-7h11L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h4.5l1 2.5h5l1-2.5H20"/>',
  wallet:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M20.5 12.5h-4a1.8 1.8 0 0 0 0 3.6h4"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  truck:'<path d="M3 6h11v10H3zM14 9h4l3 3.5V16h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  sell:'<path d="M20 12.5L12.5 20a1.4 1.4 0 0 1-2 0L4 13.5V4h9.5L20 10.5a1.4 1.4 0 0 1 0 2z"/><circle cx="8.5" cy="8.5" r="1.4"/>',
  cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v5M17.5 9.5v5"/>',
  act:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 12h6M10 16h6"/>',
  rate:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>',

function docById(id){for(var i=0;i<S.docs.length;i++)if(S.docs[i].id===id)return S.docs[i];return null}

  var k=pkey(n);if(!k)return 0;

function applyDoc(d,sign){
  d.items.forEach(function(it){var p=prod(it.pid);if(!p)return;if(!p.st[d.wh])p.st[d.wh]={q:0,r:0,w:0};p.st[d.wh].q+=sign*(d.type==='buy'?1:-1)*it.qty});

function setAutoPay(d,paid){
  S.cash=S.cash.filter(function(c){return !(c.docId===d.id&&c.auto)});
  if(paid>0)S.cash.push({id:nextId(S.cash),no:nextNo('cash'),dir:d.type==='sale'?'in':'out',date:d.date,partner:d.partner,amount:r2(paid),cur:d.cur,
    cat:d.type==='sale'?'Оплата от клиента':'Оплата поставщику',comment:'Оплата по '+d.no,docId:d.id,auto:1});
}
function addDoc(d,paid){d.id=nextId(S.docs);d.no=nextNo(d.type);S.docs.push(d);applyDoc(d,1);setAutoPay(d,paid||0);return d}
function cashBal(){var b={USD:0,TJS:0};S.cash.forEach(function(c){b[CU(c.cur)]+=c.dir==='in'?c.amount:-c.amount});b.USD=r2(b.USD);b.TJS=r2(b.TJS);return b}
/* partner operations. deb = they owe us more (we shipped goods / paid them); cred = we owe them more (we got goods / money) */
function moves(pid){
  var out=[];
  S.docs.forEach(function(d){if(d.partner!==pid)return;var s=docSum(d);
    out.push({date:d.date,no:d.no,cur:CU(d.cur),deb:d.type==='sale'?s:0,cred:d.type==='buy'?s:0,lb:DT[d.type].one+' '+d.no,sm:itemsText(d)+(d.comment?' · '+d.comment:''),doc:d.id})});
  S.cash.forEach(function(c){if(c.partner!==pid)return;
    out.push({date:c.date,no:c.no,cur:CU(c.cur),deb:c.dir==='out'?c.amount:0,cred:c.dir==='in'?c.amount:0,lb:(c.dir==='in'?'Получена оплата ':'Выплачено ')+c.no,sm:[c.cat,c.comment].filter(Boolean).join(' · ')})});
  out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.no<b.no?-1:a.no>b.no?1:0)});
  return out;
}
function bal(pid){var b={USD:0,TJS:0};moves(pid).forEach(function(m){b[m.cur]+=m.deb-m.cred});b.USD=r2(b.USD);b.TJS=r2(b.TJS);return b}

function findProd(v){
  v=String(v||'').trim();if(!v)return null;
  var c=v.split(' · ')[0].trim(),p=S.products.filter(function(x){return x.code===c})[0];if(p)return p;
  var n=norm(v);if(!n)return null;

function actTable(pid,C,from,to){
  var all=moves(pid).filter(function(m){return m.cur===C}),open=0,rows=[],sd=0,sc=0;
  all.forEach(function(m){if(from&&m.date<from)open+=m.deb-m.cred;else if(!to||m.date<=to)rows.push(m)});

  var run=open,h='<section class="cd"><div class="sh"><span class="si">'+ic('act')+'</span><span>Расчёты в '+C+'</span></div><div style="overflow-x:auto"><table class="at"><thead><tr><th>Дата / операция</th><th>Дебет</th><th>Кредит</th><th>Сальдо</th></tr></thead><tbody>';
  if(from)h+='<tr><td>Сальдо на '+fd(from)+'</td><td></td><td></td><td><b>'+f2(open)+'</b></td></tr>';
  rows.forEach(function(m){run+=m.deb-m.cred;sd+=m.deb;sc+=m.cred;
    h+='<tr><td>'+fd(m.date)+' · '+esc(m.lb)+(m.sm?'<small>'+esc(m.sm)+'</small>':'')+'</td><td>'+(m.deb?f2(m.deb):'')+'</td><td>'+(m.cred?f2(m.cred):'')+'</td><td>'+f2(run)+'</td></tr>'});
  h+='<tr class="sum"><td>Обороты'+(from||to?' за период':'')+'</td><td>'+f2(sd)+'</td><td>'+f2(sc)+'</td><td>'+f2(run)+'</td></tr></tbody></table></div>';
  var nm=pName(pid),dt=fd(to||today());run=r2(run);
  h+='<div class="dl '+(run>0?'pos':run<0?'neg':'')+'">'+(run>0?'На '+dt+' «'+esc(nm)+'» должен нам: '+mon(run,C):run<0?'На '+dt+' мы должны «'+esc(nm)+'»: '+mon(-run,C):'На '+dt+' расчёты закрыты, долга нет')+'</div>';
  if(Math.abs(run)>0.004&&!to)h+='<button class="btn t noprint" style="margin-top:8px;padding:0" data-act="apay" data-v="'+(run>0?'in':'out')+'" data-c="'+C+'" data-a="'+Math.abs(run)+'">'+(run>0?'Принять оплату':'Выплатить')+' '+mon(Math.abs(run),C)+'</button>';
  return h+'</section>';
}

  else if(o.t==='ddel'){var dd=docById(o.id),n=S.cash.filter(function(c){return c.docId===o.id}).length;

  else if(o.t==='cdel'){h='<div class="scrim" data-act="oclose"></div><div class="dlg" role="alertdialog" aria-label="Удаление"><h2>Удалить операцию?</h2><p class="note">Сумма уйдёт из кассы и из акта сверки.</p><div class="acts"><button class="btn t" data-act="oclose">Отмена</button><button class="btn d" data-act="cddo">Удалить</button></div></div>'}
  else if(o.t==='rate'){h='<div class="scrim" data-act="oclose"></div><div class="dlg" role="dialog" aria-label="Курс доллара"><h2>Курс доллара</h2><div class="fi"><label for="rtv">1 USD = ? TJS</label><input id="rtv" value="'+esc(S.rate)+'" inputmode="decimal" autocomplete="off" data-enter="rsave"></div><p class="note" style="margin-top:6px">Новый курс подставится в новые закупки и продажи. В уже сохранённых документах курс не меняется.</p><div class="acts"><button class="btn t" data-act="oclose">Отмена</button><button class="btn" data-act="rsave">Сохранить</button></div></div>'}
  else if(o.t==='pedit'){var pp=o.id?partner(o.id):null,used=o.id&&moves(o.id).length;
    h='<div class="scrim" data-act="oclose"></div><div class="dlg" role="dialog" aria-label="Контрагент"><h2>'+(pp?'Изменить контрагента':'Новый клиент или поставщик')+'</h2><div class="fi"><label for="pnv">Имя или название</label><input id="pnv" value="'+esc(pp?pp.name:'')+'" autocomplete="off" data-enter="psave"></div><div class="acts">'+(pp&&!used?'<button class="btn d" data-act="pdel">Удалить</button>':'')+'<button class="btn t" data-act="oclose">Отмена</button><button class="btn" data-act="psave">Сохранить</button></div></div>'}
  else return false;
  el.innerHTML=h;var f=el.querySelector('#rtv,#pnv');if(f)setTimeout(function(){f.focus();f.select()},30);return true;
}
function act2(a,t,id){
  switch(a){
    case 'dnew':newDoc(t.dataset.v);push({s:'dform'});break;
    case 'dopen':push({s:'doc',id:id});break;
    case 'dkebab':openOv({t:'dkebab'});break;
    case 'dedit':closeOv();editDoc(docById(cur().id));push({s:'dform'});break;
    case 'ddelask':openOv({t:'ddel',id:ui.df&&ui.df.id?ui.df.id:cur().id});break;
    case 'dddo':{var d=docById(ui.ov.id);if(d){applyDoc(d,-1);S.docs=S.docs.filter(function(x){return x!==d});S.cash=S.cash.filter(function(c){return c.docId!==d.id})}
      save();closeOv();ui.df=null;toast('Документ удалён');popTo(1);break}
    case 'dsave':saveDoc();break;
    case 'dladd':ui.df.d.items.push({prod:'',qty:'1',price:''});keep();var ins=document.querySelectorAll('[data-g$=".prod"]');if(ins.length)ins[ins.length-1].focus();break;
    case 'dlrm':ui.df.d.items.splice(+t.dataset.i,1);keep();break;
    case 'dpaidall':ui.df.d.paid=String(dTotal(ui.df.d));keep();break;
    case 'dper':ui.dp=t.dataset.v;keep();break;
    case 'dcsv':{var ty=cur().s==='buys'?'buy':'sale',L=docRows(ty);
      csv(DT[ty].list+' '+today(),['Дата','Номер транзакции',DT[ty].who,'Сумма','Валюта','Курс','Склад','Товары','Кол-во, шт','Оплачено','Долг','Комментарий'],
        L.map(function(d){var s=docSum(d),p=paidOf(d);return [fd(d.date),d.no,pName(d.partner),f2(s),CU(d.cur),d.cur==='USD'?f2(d.rate):'',whName(d.wh),itemsText(d),docQty(d),f2(p),f2(Math.max(0,s-p)),d.comment||'']}));break}
    case 'dpay':{closeOv();var dc=docById(cur().id),rest=r2(docSum(dc)-paidOf(dc));
      newCash({dir:dc.type==='sale'?'in':'out',partner:pName(dc.partner),amount:String(rest),cur:dc.cur,docId:dc.id,comment:'Оплата по '+dc.no});push({s:'cform'});break}
    case 'cnew':newCash();push({s:'cform'});break;
    case 'copen':{var c=cashById(id);if(!c)break;if(c.auto&&c.docId&&docById(c.docId)&&cur().s!=='doc'){push({s:'doc',id:c.docId});break}editCash(c);push({s:'cform'});break}
    case 'cdir':ui.cf.d.dir=t.dataset.v;ui.cf.d.cat=CATS[t.dataset.v][0];keep();break;
    case 'csave':saveCash();break;
    case 'cdelask':openOv({t:'cdel'});break;
    case 'cddo':{var cid=ui.cf&&ui.cf.id;S.cash=S.cash.filter(function(x){return x.id!==cid});save();closeOv();ui.cf=null;toast('Операция удалена');popTo(ui.nav.length-1);break}
    case 'cfil':ui.cfil=t.dataset.v;keep();break;
    case 'cper':ui.cp=t.dataset.v;keep();break;
    case 'ccsv':csv('Касса '+today(),['Дата','Номер','Приход/Расход','Сумма','Валюта','Статья','Контрагент','Документ','Комментарий'],
        cashRows().map(function(c){var dc=c.docId?docById(c.docId):null;return [fd(c.date),c.no,c.dir==='in'?'Приход':'Расход',f2(c.amount),CU(c.cur),c.cat||'',pName(c.partner),dc?dc.no:'',c.comment||'']}));break;
    case 'rate':closeDrawer();openOv({t:'rate'});break;
    case 'rsave':{var r=num($('#rtv').value);if(!(r>0))return toast('Курс должен быть больше нуля');S.rate=r;save();closeOv();toast('Курс сохранён: 1 USD = '+f2(r)+' TJS');render();break}
    case 'aopen':push({s:'actp',id:id});break;
    case 'pnew':openOv({t:'pedit',id:0});break;
    case 'pedit':openOv({t:'pedit',id:cur().id});break;
    case 'psave':{var nm=($('#pnv').value||'').trim().replace(/\s+/g,' ');if(!nm)return toast('Введите имя');
      var ex=partnerByName(nm,false);if(ex&&ex!==ui.ov.id)return toast('Такой контрагент уже есть');
      if(ui.ov.id)partner(ui.ov.id).name=nm;else partnerByName(nm,true);save();closeOv();toast('Сохранено');render();break}
    case 'pdel':{var pid=ui.ov.id;S.partners=S.partners.filter(function(x){return x.id!==pid});save();closeOv();toast('Удалено');popTo(1);break}
    case 'aall':ui.ap={from:'',to:''};keep();break;
    case 'aprint':try{if(window.AndroidApp&&AndroidApp.print)AndroidApp.print();else window.print()}catch(e){toast('Печать недоступна')}break;
    case 'apay':newCash({dir:t.dataset.v,partner:pName(cur().id),amount:String(r2(+t.dataset.a)),cur:t.dataset.c,cat:t.dataset.v==='in'?'Оплата от клиента':'Оплата поставщику'});push({s:'cform'});break;
  }
}
function gIn(t,ch){
  var k=t.dataset.g,v=t.value;
  if(k==='dq'){ui.dq=v;fillDocs();return}
  if(k==='aq'){ui.aq=v;fillAct();return}
  if(k==='af'||k==='at'){if(ch){ui.ap[k==='af'?'from':'to']=v;keep()}return}
  if(k.indexOf('c.')===0){if(ui.cf)ui.cf.d[k.slice(2)]=v;return}
  if(!ui.df)return;var d=ui.df.d,p=k.split('.');
  if(p[0]==='it'){var L=d.items[+p[1]];if(!L)return;L[p[2]]=v;
    if(p[2]==='prod'){if(ch){var pr=findProd(v);if(pr){L.prod=pr.code+' · '+pr.name;if(L.price==='')L.price=String(defPrice(pr,d))}keep()}return}
    updTot();return}
  d[k]=v;
  if(k==='cur'&&ch&&d._cur!==v){var rate=num(d.rate)||S.rate;
    d.items.forEach(function(L){if(L.price!=='')L.price=String(r2(v==='USD'?num(L.price)/rate:num(L.price)*rate))});d._cur=v;keep();toast('Цены пересчитаны по курсу '+f2(rate));return}
  if(k==='wh'&&ch){keep();return}
  if(k==='paid'||k==='rate')updTot();
}

/* demo documents so every section has something to look at */
function seedDocs(){
  var P=S.products,sup=partnerByName('Шамсулло баллон',true),c1=partnerByName('Фирдавс (Ҳисор)',true),c2=partnerByName('Автосервис «Мотор»',true);
  S.cash.push({id:1,no:nextNo('cash'),dir:'in',date:daysAgo(7),partner:0,amount:5000,cur:'TJS',cat:'Прочий приход',comment:'Начальный остаток кассы',docId:0});
  S.cash.push({id:2,no:nextNo('cash'),dir:'in',date:daysAgo(7),partner:0,amount:600,cur:'USD',cat:'Прочий приход',comment:'Начальный остаток кассы',docId:0});
  addDoc({type:'buy',date:daysAgo(5),partner:sup,wh:1,cur:'USD',rate:S.rate,items:[{pid:P[5].id,qty:8,price:30},{pid:P[9].id,qty:4,price:35}],comment:'Партия из Китая'},300);
  addDoc({type:'sale',date:daysAgo(2),partner:c1,wh:1,cur:'TJS',rate:S.rate,items:[{pid:P[0].id,qty:4,price:P[0].price}],comment:'Покупатель Фирдавс, продавец Ахмад'},P[0].price*4);
  addDoc({type:'sale',date:today(),partner:c2,wh:2,cur:'TJS',rate:S.rate,items:[{pid:P[6].id,qty:2,price:P[6].price},{pid:P[1].id,qty:1,price:P[1].price}],comment:'Работник: Самад'},500);
  S.cash.push({id:nextId(S.cash),no:nextNo('cash'),dir:'out',date:daysAgo(1),partner:0,amount:1500,cur:'TJS',cat:'Аренда',comment:'Аренда склада за месяц',docId:0});
}

if(S._demo){delete S._demo;seedDocs();save()}

/* ---------- render ---------- */
function render(){
  var s=cur(),h;
  if(s.s==='card')h=vCard(s.id);else if(s.s==='form')h=vForm();else if(s.s==='whs')h=vWhs();else if(s.s==='set')h=vSet();
  else if(s.s==='buys'||s.s==='sales')h=vDocs(s.s==='buys'?'buy':'sale');else if(s.s==='doc')h=vDoc(s.id);else if(s.s==='dform')h=vDForm();
  else if(s.s==='cash')h=vCash();else if(s.s==='cform')h=vCForm();else if(s.s==='act')h=vAct();else if(s.s==='actp')h=vActP(s.id);
  else h=vList();
  $('#screen').innerHTML=h;
  if(s.s==='list'){plist();var sc=$('.sc');if(sc)sc.scrollTop=ui.lscroll||0}
}
function resetScroll(){ui.lscroll=0}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,id=+t.dataset.id;
  switch(a){
    case 'drawer':openDrawer();break;
    case 'dclose':closeDrawer();break;
    case 'go':if(t.dataset.v==='list'){ui.f.wh=0}top(t.dataset.v);break;
    case 'back':back();break;
    case 'open':push({s:'card',id:id});break;
    case 'wb':ui.exp[id]=!ui.exp[id];plist();break;
    case 'new':formNew();push({s:'form'});break;
    case 'edit':closeOv();formEdit(prod(cur().id));push({s:'form'});break;
    case 'copy':{closeOv();var p=prod(cur().id),c=JSON.parse(JSON.stringify(p));c.id=nextId(S.products);c.code=nextCode();c.name=p.name+' (копия)';c.barcode='';for(var w in c.st)c.st[w]={q:0,r:0,w:0};S.products.push(c);save();toast('Копия создана');push({s:'card',id:c.id});break}
    case 'kebab':openOv({t:'kebab'});break;
    case 'save':saveForm();break;
    case 'delask':openOv({t:'del',id:ui.form&&ui.form.id?ui.form.id:cur().id});break;
    case 'deldo':{var did=ui.ov.id;if(S.docs.some(function(d){return d.items.some(function(it){return it.pid===did})})){closeOv();return toast('Товар есть в закупках или продажах. Удалить нельзя')}S.products=S.products.filter(function(x){return x.id!==did});delete ui.exp[did];save();closeOv();ui.form=null;
      toast('Товар удалён');popTo(1);break}
    case 'oclose':closeOv();break;
    case 'sopen':ui.search=true;resetScroll();render();var si=$('#sq');if(si)si.focus();break;
    case 'sclose':ui.search=false;ui.q='';resetScroll();render();break;
    case 'sclear':ui.q='';resetScroll();render();var sj=$('#sq');if(sj)sj.focus();break;
    case 'filter':openOv({t:'filter'});break;
    case 'fwh':ui.f.wh=id;resetScroll();ovl();render();break;
    case 'fst':ui.f.st=t.dataset.v;resetScroll();ovl();render();break;
    case 'fwh0':ui.f.wh=0;resetScroll();render();break;
    case 'fst0':ui.f.st='all';resetScroll();render();break;
    case 'freset':ui.f={wh:0,st:'all'};resetScroll();ovl();render();break;
    case 'scan':openOv({t:'scan'});break;
    case 'scango':scanGo();break;
    case 'whopen':ui.f.wh=id;ui.f.st='all';top('list');break;
    case 'whnew':openOv({t:'wh',id:0});break;
    case 'whedit':openOv({t:'wh',id:id});break;
    case 'whsave':{var n=($('#whn').value||'').trim();if(!n)return toast('Введите название склада');
      if(ui.ov.id){S.wh.forEach(function(w){if(w.id===ui.ov.id)w.name=n})}else{S.wh.push({id:nextId(S.wh),name:n})}
      save();closeOv();toast('Склад сохранён');render();break}
    case 'whdel':{var wid=ui.ov.id;
      if(S.wh.length<2)return toast('Нужен хотя бы один склад');
      if(S.products.some(function(p){var s=stOf(p,wid);return s.q||s.r||s.w}))return toast('На складе есть остатки. Сначала обнулите их');
      if(S.docs.some(function(d){return d.wh===wid}))return toast('Склад есть в закупках или продажах. Удалить нельзя');
      S.wh=S.wh.filter(function(w){return w.id!==wid});S.products.forEach(function(p){delete p.st[wid]});if(ui.f.wh===wid)ui.f.wh=0;
      save();closeOv();toast('Склад удалён');render();break}
    case 'copybk':{var ta=$('#bk');ta.select();var ok=function(){toast('Данные скопированы')};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(ok,function(){toast('Выделено. Нажмите «Копировать» в меню телефона')});else toast('Выделено. Нажмите «Копировать» в меню');break}
    case 'restore':try{var o=migrate(JSON.parse($('#rs').value));if(!o)throw 0;S=o;save();toast('Данные восстановлены');render()}catch(er){toast('Не удалось прочитать данные. Вставьте копию целиком')}break;
    case 'blank':if(!t._a){t._a=1;t.textContent='Нажмите ещё раз: всё удалится';setTimeout(function(){t._a=0;t.textContent='Начать с нуля (всё удалить)'},5000)}else{S={v:2,name:S.name,rate:S.rate,wh:[{id:1,name:'Основной склад'}],products:[],partners:[],docs:[],cash:[],seq:{buy:0,sale:0,cash:0}};save();ui.f={wh:0,st:'all'};ui.q='';ui.exp={};toast('Склад очищен. Добавьте товары кнопкой «+»');top('list')}break;
    default:act2(a,t,id);break;
    case 'demo':S=migrate(seed());seedDocs();save();ui.f={wh:0,st:'all'};ui.q='';ui.exp={};toast('Демо-данные возвращены');top('list');break;
  }
});
function scanGo(){
  var v=($('#scv').value||'').trim();if(!v)return;
  var n=norm(v),p=S.products.filter(function(x){return norm(x.code)===n||norm(x.barcode||'')===n||(/^\d+$/.test(v)&&parseInt(x.code,10)===parseInt(v,10))})[0];
  if(!p)return toast('Товар с кодом «'+v+'» не найден');
  closeOv();push({s:'card',id:p.id});
}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='sq'){ui.q=t.value;resetScroll();plist();var h=$('.bar');var c=h&&h.querySelector('[data-act="sclear"]');if(t.value&&!c){var b=document.createElement('button');b.className='ib';b.dataset.act='sclear';b.setAttribute('aria-label','Очистить');b.innerHTML=ic('close');h.appendChild(b)}else if(!t.value&&c)c.remove()}
  else if(t.dataset&&t.dataset.f&&ui.form)setF(t.dataset.f,t.value);
  else if(t.dataset&&t.dataset.g)gIn(t,false);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f&&ui.form)setF(t.dataset.f,t.value);
  else if(t.dataset&&t.dataset.g)gIn(t,true);
  else if(t.id==='s-name'){S.name=t.value.trim()||'Склад шин';save();toast('Сохранено')}
  else if(t.id==='s-rate'){var r=num(t.value);if(r>0){S.rate=r;save();toast('Курс сохранён')}else toast('Курс должен быть больше нуля')}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(ui.ov)closeOv();else if(ui.drawer)closeDrawer();else if(ui.search&&cur().s==='list'){ui.search=false;ui.q='';render()}}
  else if(e.key==='Enter'){
    if(e.target.id==='scv'){e.preventDefault();scanGo()}
    else if(e.target.dataset&&e.target.dataset.enter){e.preventDefault();var be=document.querySelector('[data-act="'+e.target.dataset.enter+'"]');if(be)be.click()}
    else if(e.target.id==='whn'){e.preventDefault();var b=document.querySelector('[data-act="whsave"]');if(b)b.click()}
    else if(e.target.classList&&e.target.classList.contains('row')){e.preventDefault();e.target.click()}
  }
});
render();
})();
</script>
